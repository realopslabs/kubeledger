# Default values for kubeledger.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

envs:
  KL_DB_LOCATION: /data/db
  KL_K8S_API_ENDPOINT: https://kubernetes.default
  KL_COST_MODEL: CUMULATIVE_RATIO
  KL_BILLING_HOURLY_RATE: 0.0
  KL_BILLING_CURRENCY_SYMBOL: $
  KL_K8S_API_VERIFY_SSL: true
  KL_K8S_CACERT: /run/secrets/kubernetes.io/serviceaccount/ca.crt
  KL_INCLUDED_NAMESPACES: ''
  KL_EXCLUDED_NAMESPACES: ''

# NVIDIA DCGM Exporter integration for GPU metrics
# Set endpoint to enable GPU metrics collection (requires DCGM Exporter deployed in cluster)
# Example: http://dcgm-exporter.gpu-operator:9400/metrics
dcgm:
  enabled: false
  endpoint: 'http://dcgm-exporter.gpu-operator:9400/metrics'

dataVolume:
  persist: true
  capacity: 500Mi
#  storageClass: default

# overrides envs.INCLUDED_NAMESPACES
includedNamespaces: []

# overrides envs.EXCLUDED_NAMESPACES
excludedNamespaces: []

prometheusOperator:
  enabled: false
  labels:

securityContext:
  enabled: true
  openshift: false
  uid: 4583
  gid: 4583

replicaCount: 1

image:
  repository: ghcr.io/realopslabs/kubeledger
  pullPolicy: Always

nameOverride: ""
fullnameOverride: ""

metadata:
  labels:
    app: kubeledger

service:
  type: ClusterIP
  port: 80
  targetPort: 5483

# Optional MCP (Model Context Protocol) server.
# When enabled, a second container is added to the pod, reusing the same image
# with command override "python3 -u ./mcp_server.py". It reads static/data/*.json
# in read-only mode and exposes the data to MCP clients (e.g. Claude Desktop)
# via HTTP/SSE. Disabled by default: opt-in. See docs/kubeledger-mcp-spec.md.
mcp:
  enabled: false
  # Port at which the MCP server listens inside the container, and the port
  # exposed by the Service. Defaults to 5484: one above the backend's 5483,
  # to keep the two KubeLedger ports adjacent and memorable.
  # Keep both aligned with the MCP server bind port.
  service:
    port: 5484
    targetPort: 5484
  # Per-container resource block for the MCP sidecar. The MCP server is light
  # (JSON parsing + asyncio); the defaults reflect that.
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    # limits:
    #   cpu: 200m
    #   memory: 256Mi

# NetworkPolicy for the KubeLedger pod.
# In v1 the MCP server has no authentication; access control relies entirely
# on this NetworkPolicy. It is therefore enabled by default and covers BOTH
# the backend (HTTP/UI) and the MCP ports. Empty source lists mean
# deny-by-default: an operator must explicitly list authorized clients.
# Requires a network plugin that enforces NetworkPolicy (e.g. OVN-Kubernetes
# on OpenShift).
networkPolicy:
  enabled: true
  # NetworkPolicyPeer entries (namespaceSelector / podSelector / ipBlock)
  # authorized to reach the backend (UI + Flask API + /metrics). Empty list
  # = deny-by-default. Examples (uncomment and adapt as needed):
  #
  # allowedSources:
  #   # Pods opted-in via label inside the same namespace
  #   - podSelector:
  #       matchLabels:
  #         kubeledger-client: "true"
  #   # Any pod from a labelled namespace
  #   - namespaceSelector:
  #       matchLabels:
  #         kubernetes.io/metadata.name: monitoring
  #   # Specific Prometheus pods scraping /metrics
  #   - namespaceSelector:
  #       matchLabels:
  #         kubernetes.io/metadata.name: openshift-monitoring
  #     podSelector:
  #       matchLabels:
  #         app.kubernetes.io/name: prometheus
  #   # A trusted CIDR (e.g. corporate ingress)
  #   - ipBlock:
  #       cidr: 10.0.0.0/16
  allowedSources: []
  # NetworkPolicyPeer entries authorized to reach the MCP server.
  # Typically a stricter set than allowedSources. Same shape as above.
  # Empty list = no source authorized: MCP unreachable, even when
  # mcp.enabled is true. Example: only allow the AI assistant proxy pod.
  #
  # mcpAllowedSources:
  #   - podSelector:
  #       matchLabels:
  #         app.kubernetes.io/name: claude-mcp-proxy
  mcpAllowedSources: []

ingress:
  enabled: false
  annotations: {}
  labels: {}
  hosts:
    - host: kubeledger.local
      paths: []
# uncomment the following lines and ajust the values to enable TLS
  # tls:
  #  - secretName: kubeledger-tls
  #    hosts:
  #      - kubeledger.local

# priorityClassName: default

resources:
# No resource requests not limits is specified by default.
# We leave this as a conscious choice for the user, as this increases chances charts run
# on environments with little resources, such as Minikube.
# If you do want to specify resources, uncomment the following lines, adjust them as necessary,
# and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 256m
  #   memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}
